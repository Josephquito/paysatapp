<ng-container *ngIf="vm$ | async as vm">
  <!-- BOTÓN FLOTANTE -->
  <button
    class="chat-fab"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="vm.isOpen"
    aria-label="Abrir chat"
  >
    <span class="chat-fab__dot"></span>
    <span class="chat-fab__label">Chat Bot</span>

    <span class="chat-fab__badge" *ngIf="vm.unread > 0">{{ vm.unread }}</span>
  </button>

  <!-- PANEL FLOTANTE -->
  <section class="chat-panel" [class.is-open]="vm.isOpen" role="dialog" aria-label="Chat PAYSAT">
    <header class="chat-panel__header">
      <div class="chat-panel__brand">
        <div class="chat-panel__dot"></div>
        <div class="chat-panel__titles">
          <div class="chat-panel__title">Chat Bot PAYSAT</div>
          <div class="chat-panel__subtitle">Servicio al cliente de Paysat</div>
        </div>
      </div>

      <i class="pi pi-times" (click)="close()"></i>
    </header>

    <div class="chat-panel__body" #scrollRef>
      <!-- Mensajes -->
      <div
        class="chat-msg"
        *ngFor="let m of vm.messages"
        [class.is-user]="m.from === 'user'"
        [class.is-bot]="m.from === 'bot'"
      >
        <div class="chat-msg__bubble">
          <div class="chat-msg__meta">
            <strong>{{ m.from === 'user' ? 'Tú' : 'PAYSAT' }}</strong>
          </div>
          <div class="chat-msg__text">{{ m.text }}</div>
        </div>
      </div>

      <!-- Typing -->
      <div class="chat-typing" *ngIf="vm.loading">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="chat-typing__text">PAYSAT está escribiendo…</span>
      </div>

      <!-- Estado vacío -->
      <div class="chat-empty" *ngIf="vm.showEmpty">Hola 👋 ¿En qué te puedo ayudar?</div>
    </div>

    <footer class="chat-panel__footer">
      <textarea
        #msgBox
        class="chat-input"
        [ngModel]="vm.draft"
        (ngModelChange)="onDraftChange($event)"
        (input)="autoGrow(msgBox)"
        (keydown.enter)="onEnter($event, msgBox)"
        placeholder="Escribe tu mensaje…"
        rows="1"
      ></textarea>

      <i
        class="pi pi-send"
        (click)="send()"
        [class.is-disabled]="!vm.canSend"
        [attr.aria-disabled]="!vm.canSend"
      ></i>
    </footer>
  </section>

  <!-- Backdrop -->
  <div class="chat-backdrop" [class.is-open]="vm.isOpen" (click)="close()"></div>
</ng-container>
