<main class="open-account">
  <section class="open-account__wrap">
    <div class="open-account__content">
      <h1 class="open-account__title">¡Abre cuenta digital en minutos!</h1>
      <p class="open-account__subtitle">
        Abre tu cuenta, transfiere y revisa tu dinero desde nuestra App, necesitas tu celular y tu
        documento de identidad
      </p>

      <div class="open-account__stores">
        <a class="store-badge" [href]="appStoreUrl" target="_blank" rel="noopener noreferrer">
          <img src="AS-download.png" alt="Descargar en App Store" />
        </a>

        <a class="store-badge" [href]="googlePlayUrl" target="_blank" rel="noopener noreferrer">
          <img src="GP-download.png" alt="Descargar en Google Play" />
        </a>
      </div>
    </div>

    <div class="open-account__media">
      <img src="mockups.png" alt="App PAYSAT en celular" />
    </div>
  </section>
</main>
